[package]
name = "mini-redis"
version = "0.1.0"
edition = "2021"
description = "A Redis-compatible in-memory key-value server written in Rust with Tokio"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
